name: Publish to npm

on:
  # Run CI when a new version tag is created
  push:
    tags:
      - 'v*'

jobs:
  # Automatic release on version tag
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for OIDC
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # Do NOT set registry-url

      - run: npm ci
      - run: npm run test:check
      - run: npm run build
      - run: |
          if [[ "${{ github.ref_name }}" == *b* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
