name: Node.js CI

on:
  # Run CI when a new branch or tag is created
  create:
    # Only run if the tag is a supported version tag
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Run CI when a new commit is pushed
  push:
    branches: [main, dev]
  # Run CI when a new pull request is created
  pull_request:
    branches: [main, dev]
  # Allow manual triggering of this workflow
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        node-version:
          - 26
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true
      - run: npm ci
      - run: npm run format:check
        continue-on-error: true
      - run: npm run lint:check
        continue-on-error: true
      - run: npm run test:check
        continue-on-error: true
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      - run: npm run create:schema
        continue-on-error: true
      - uses: oven-sh/setup-bun@v2
      - run: ./build_binary.sh
        continue-on-error: true
      # Upload bundled files and created schema in dist for deploy job (TODO)
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist_bun/
            dist/
            *.schema.json

