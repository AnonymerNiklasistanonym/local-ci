name: Node.js CI

on:
  # Run CI when a new branch or tag is created
  create:
    # Only run if the tag is a supported version tag
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Run CI when a new commit is pushed
  push:
    branches: [main, dev]
  # Run CI when a new pull request is created
  pull_request:
    branches: [main, dev]
  # Allow manual triggering of this workflow
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        bun-version:
          - 1.4.x
        node-version:
          - 26
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: true
      - run: npm ci
      - run: npm run format:check
        continue-on-error: true
      - run: npm run lint:check
        continue-on-error: true
      - run: npm run test:check
        continue-on-error: true
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build
      - run: npm run create:schema
        continue-on-error: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: ./build_binary.sh
        continue-on-error: true
      # Upload bundled files and created schema in dist for deploy job (TODO)
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: check-artifacts
          path: |
            dist_bun/
            dist/
            *.schema.json

  # Automatic release on version tag
  deploy:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: check-artifacts
      - name: Display structure of downloaded files
        run: ls -R
      - name: Prepare assets
        run: |
          mkdir -p release
          zip -r release/dist.zip dist
          cp -r dist_bun/* release/
          cp *.schema.json release/
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'b') }}
          files: |
            release/*
